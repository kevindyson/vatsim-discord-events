name: VATSIM Events to Discord

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  check-events:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ejecutar bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python vatsim_events.py

      - name: Guardar eventos publicados
        run: |
          git config user.name "AeroClub MSFS Bot"
          git config user.email "bot@aeroclub-msfs.local"
          git add published_events.json
          git diff --cached --quiet || git commit -m "Actualizar eventos publicados"
          git push
